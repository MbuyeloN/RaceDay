
name: RaceDay Part 2 Build and Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.API/RaceDay.API.slnx

      - name: Build solution
        run: dotnet build RaceDay.API/RaceDay.API.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.API/RaceDay.API.slnx --configuration Release --no-build
